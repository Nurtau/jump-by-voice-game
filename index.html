<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Voice Jump - Voice Controlled Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
    }

    #gameContainer {
      position: relative;
      background: #000;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      touch-action: none;
    }

    /* Desktop: preserve aspect ratio with max width */
    @media (min-width: 768px) {
      #gameContainer {
        width: auto;
        height: auto;
        max-width: 90vw;
        max-height: 90vh;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }

      #gameCanvas {
        width: 1280px;
        height: 720px;
        max-width: 90vw;
        max-height: 90vh;
      }
    }

    /* Mobile: fill screen */
    @media (max-width: 767px) {
      #gameCanvas {
        width: 100vw !important;
        height: 100vh !important;
      }
    }

    /* Landscape mobile: adjust for notches */
    @media (max-width: 767px) and (orientation: landscape) {
      #gameCanvas {
        width: 100vw !important;
        height: 100vh !important;
      }
    }

    /* Prevent pull-to-refresh on mobile */
    body {
      overscroll-behavior-y: none;
    }

    /* Loading screen */
    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      font-family: 'Press Start 2P', monospace;
      color: #FFD700;
    }

    #loadingScreen.hidden {
      display: none;
    }

    .loading-text {
      font-size: 24px;
      margin-bottom: 30px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #333;
      border-top: 5px solid #FFD700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-info {
      font-size: 12px;
      color: #888;
      margin-top: 20px;
      text-align: center;
      max-width: 80%;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Error screen */
    #errorScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a2e;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      font-family: 'Press Start 2P', monospace;
      color: #FF0000;
      padding: 20px;
    }

    #errorScreen.visible {
      display: flex;
    }

    .error-title {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .error-message {
      font-size: 12px;
      color: #CCC;
      margin-bottom: 30px;
      text-align: center;
      max-width: 90%;
      line-height: 1.8;
    }

    .error-button {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .error-button:hover {
      background: #FFA500;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="loading-text">🎮 VOICE JUMP 🎮</div>
    <div class="loading-spinner"></div>
    <div class="loading-info">Loading game assets...</div>
  </div>

  <!-- Error Screen -->
  <div id="errorScreen">
    <div class="error-title">⚠️ ERROR ⚠️</div>
    <div class="error-message" id="errorMessage">
      Failed to load game. Please check your browser compatibility.
    </div>
    <button class="error-button" onclick="location.reload()">RELOAD PAGE</button>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
